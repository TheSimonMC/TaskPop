<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPop</title>
    <link rel="icon" type="image/png" href="favicon48c.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <div id="app">
        
        <header class="top-bar">
            <div class="logo-area">
                <span class="material-icons-round logo-icon">dashboard</span>
                <h1>TaskPop</h1>
            </div>
            
            <div class="project-tabs-container" id="project-tabs">
                </div>
            
            <button class="icon-btn" id="add-project-btn">
                <span class="material-icons-round">add</span>
            </button>
            
            <div class="spacer"></div>
            
            <div class="global-actions">
                <button class="btn-primary" id="new-task-btn">
                    <span class="material-icons-round">add</span> <span id="lbl-new-task">New Task</span>
                </button>
                <button class="icon-btn" id="settings-open-btn">
                    <span class="material-icons-round">settings</span>
                </button>
            </div>
        </header>

        <section class="controls-bar">
            <div class="search-box">
                <span class="material-icons-round">search</span>
                <input type="text" id="search-input" placeholder="Search tasks...">
            </div>

            <div class="filters">
                <select id="filter-priority">
                    <option value="all" id="opt-all">All Priorities</option>
                    <option value="high" id="opt-high">High</option>
                    <option value="medium" id="opt-medium">Medium</option>
                    <option value="low" id="opt-low">Low</option>
                </select>

                <select id="sort-select">
                    <option value="created" id="opt-sort-created">Sort: Created</option>
                    <option value="due" id="opt-sort-due">Sort: Due Date</option>
                    <option value="priority" id="opt-sort-priority">Sort: Priority</option>
                </select>
                
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-done">
                    <span class="slider"></span>
                    <span class="label-text" id="lbl-show-done">Show Done</span>
                </label>
            </div>

            <div class="view-toggles">
                <button class="view-btn active" data-view="board">
                    <span class="material-icons-round">grid_view</span>
                </button>
                <button class="view-btn" data-view="list">
                    <span class="material-icons-round">view_list</span>
                </button>
            </div>
        </section>

        <main id="workspace" class="board-view">
            <div class="board-surface" id="board-surface">
                </div>
            
            <div class="list-container" id="list-container" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th id="th-status">Status</th>
                            <th id="th-title">Title</th>
                            <th id="th-priority">Priority</th>
                            <th id="th-due">Due Date</th>
                            <th id="th-tags">Tags</th>
                            <th id="th-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="list-tbody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay hidden" id="settings-modal">
        <div class="modal card-style mini-modal">
            <h2 id="lbl-settings-title">Settings</h2>
            
            <div class="form-group">
                <label id="lbl-view-mode">Board Mode</label>
                <div class="toggle-group">
                    <button class="btn-toggle active" id="mode-focused">Focused</button>
                    <button class="btn-toggle" id="mode-infinite">Infinite</button>
                </div>
                <div style="font-size:0.75rem; color:var(--text-light); margin-top:5px; line-height:1.2;">
                    "Focused" shows one project tabs.<br>"Infinite" puts all projects on one giant map.
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-language">Language</label>
                <div class="toggle-group">
                    <button class="btn-toggle active" id="lang-en">English</button>
                    <button class="btn-toggle" id="lang-de">Deutsch</button>
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-theme">Theme</label>
                <div class="toggle-group">
                    <button class="btn-toggle active" id="theme-light">Light</button>
                    <button class="btn-toggle" id="theme-dark">Dark</button>
                </div>
            </div>

            <hr style="border:0; border-top:1px solid var(--text-light); opacity:0.3; margin: 15px 0;">

            <div class="form-group">
                <label id="lbl-data">Data</label>
                            
                <button class="btn-primary" id="backup-btn" style="width:100%; justify-content:center; margin-bottom:10px;">
                  <span class="material-icons-round">download</span> <span id="lbl-backup">Backup Data</span>
                </button>
            
                <button class="btn-primary" id="import-btn" style="width:100%; justify-content:center;">
                  <span class="material-icons-round">upload</span> <span id="lbl-import">Import Backup</span>
                </button>
            
                <!-- hidden file picker -->
                <input type="file" id="import-file" accept="application/json,.json" style="display:none;" />
            </div>

            <div class="modal-actions" style="justify-content: center;">
                <button class="btn-text" id="close-settings">Close</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="task-modal">
        <div class="modal card-style">
            <h2 id="modal-title">Edit Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                
                <div class="form-group">
                    <label id="lbl-form-title">Title</label>
                    <input type="text" id="task-title" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label id="lbl-form-status">Status</label>
                        <select id="task-status">
                            <option value="todo">Todo</option>
                            <option value="doing">Doing</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="lbl-form-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-form-desc">Description</label>
                    <textarea id="task-desc" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label id="lbl-form-due">Due Date</label>
                        <input type="date" id="task-due">
                    </div>
                    <div class="form-group">
                        <label id="lbl-form-color">Color</label>
                        <div class="color-picker" id="color-picker">
                            <div class="color-dot selected" data-color="#ffffff" style="background:#ffffff"></div>
                            <div class="color-dot" data-color="#ffcfdf" style="background:#ffcfdf"></div>
                            <div class="color-dot" data-color="#fefdca" style="background:#fefdca"></div>
                            <div class="color-dot" data-color="#e0f9b5" style="background:#e0f9b5"></div>
                            <div class="color-dot" data-color="#a5dee5" style="background:#a5dee5"></div>
                            <div class="color-dot" data-color="#e2c6ff" style="background:#e2c6ff"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-form-tags">Tags</label>
                    <input type="text" id="task-tags">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-text" id="cancel-task-btn">Cancel</button>
                    <button type="submit" class="btn-primary" id="btn-save-task">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="confirm-modal">
        <div class="modal card-style mini-modal">
            <h3 id="confirm-msg">Are you sure?</h3>
            <div class="modal-actions">
                <button class="btn-text" id="confirm-no">No</button>
                <button class="btn-danger" id="confirm-yes">Yes</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="project-modal">
        <div class="modal card-style mini-modal">
            <h2 id="lbl-new-project">New Project</h2>
            <input type="text" id="new-project-name">
            <div class="modal-actions">
                <button class="btn-text" id="cancel-project">Cancel</button>
                <button class="btn-primary" id="save-project">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="import-choice-modal">
      <div class="modal card-style mini-modal">
        <h2 id="lbl-import-title">Import Backup</h2>
        <p id="lbl-import-desc" style="margin:10px 0; color:var(--text-light); line-height:1.3;">
          What do you want to do with the imported backup?
        </p>
    
        <div id="import-summary" style="font-size:0.85rem; margin:10px 0; color:var(--text-main); opacity:0.9;"></div>
    
        <div class="modal-actions" style="flex-direction: column; gap: 10px;">
          <button class="btn-primary" id="import-separate-btn" style="width:100%; justify-content:center;">
            <span class="material-icons-round">library_add</span>
            <span id="lbl-import-separate">Import separately</span>
          </button>
      
          <button class="btn-primary" id="import-merge-btn" style="width:100%; justify-content:center;">
            <span class="material-icons-round">merge</span>
            <span id="lbl-import-merge">Merge into current project</span>
          </button>
      
          <button class="btn-text" id="import-cancel-btn">
            <span id="lbl-import-cancel">Cancel</span>
          </button>
        </div>
      </div>
    </div>


    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
